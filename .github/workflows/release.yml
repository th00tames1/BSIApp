# 안드로이드 설치 파일(APK) 배포 — 버전 태그(v0.3.5 등)를 올리면 빌드해 GitHub 릴리스에 게시한다.
# 앱의 설정 → 앱 업데이트가 이 릴리스를 읽어 새 버전을 받아 설치한다.
#
# 서명: 앱 안 업데이트는 같은 키로 서명된 APK만 덮어 설치할 수 있다. 그래서 저장소
# Secrets의 키 하나로만 서명한다(SETUP.md "배포"). Secrets가 없으면 **빌드를 건너뛴다**
# (실패로 표시하지 않는다) — 그때는 로컬에서 같은 키로 빌드한 APK를 릴리스에 직접 올린다.
name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # 수동 실행 = 빌드·서명 확인만(게시는 태그일 때만)

permissions:
  contents: write

jobs:
  # Secrets는 job 조건에 바로 못 쓰므로 먼저 있는지만 본다
  key:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PW" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PW" ]; then
            echo "::notice::서명 키 Secrets가 없어 자동 빌드를 건너뜁니다 — 릴리스에 APK를 직접 올리세요(SETUP.md 7장)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

  apk:
    needs: key
    if: needs.key.outputs.ok == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: 서명 키 준비
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload.keystore
          printf 'storeFile=app/upload.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PW" "$KEY_ALIAS" "$KEY_PW" > android/key.properties

      - name: 태그와 앱 버전이 같은지 확인
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "::error::태그 $GITHUB_REF_NAME 와 pubspec 버전 v$V 가 다릅니다"; exit 1; }
          grep -q "kAppVersion = '$V'" lib/src/services/raw_archive.dart \
            || { echo "::error::lib/src/services/raw_archive.dart 의 kAppVersion 이 $V 가 아닙니다"; exit 1; }
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - run: flutter pub get
      - run: flutter test

      # 현장 폰은 모두 arm64 — 한 ABI만 넣어 크기를 줄인다(split-per-abi와 달리 versionCode가 그대로다)
      - run: flutter build apk --release --target-platform android-arm64

      # 현장 폰 앱과 같은 인증서인지 확인한다(ANDROID_CERT_SHA256 Secret이 있을 때).
      # 다르면 게시해도 폰에서 "앱이 설치되지 않음"이 되므로 여기서 멈춘다.
      - name: 서명 확인
        env:
          WANT: ${{ secrets.ANDROID_CERT_SHA256 }}
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee cert.txt
          GOT=$(grep -m1 'certificate SHA-256 digest' cert.txt | sed 's/.*: *//' | tr -d ':' | tr 'A-F' 'a-f')
          if [ -n "$WANT" ]; then
            W=$(echo "$WANT" | tr -d ': ' | tr 'A-F' 'a-f')
            [ "$GOT" = "$W" ] || { echo "::error::서명 인증서가 다릅니다 (APK $GOT ≠ 기대 $W)"; exit 1; }
          fi
          echo "서명 인증서 SHA-256: $GOT"

      - name: 설치 파일 이름 붙이기
        run: |
          V=${APP_VERSION:-$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')}
          mv build/app/outputs/flutter-apk/app-release.apk "bsi_app-v$V-arm64.apk"
          echo "APK=bsi_app-v$V-arm64.apk" >> "$GITHUB_ENV"
          git log -1 --format=%B > release_notes.md

      - name: 릴리스 게시
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: BSI_app ${{ github.ref_name }}
          body_path: release_notes.md
          files: ${{ env.APK }}

      - name: 설치 파일 보관(수동 실행)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}
