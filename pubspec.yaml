name: bsi_field
description: "BSI_app — 산불피해목 진단·복원 지원 현장 앱"
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # On-device inference
  flutter_onnxruntime: ^1.8.0

  # Imaging
  image: ^4.0.0
  camera: 0.12.0+1

  # Storage / files
  sqflite: 2.4.2
  shared_preferences: ^2.3.2
  path: ^1.9.0
  path_provider: 2.1.5
  csv: 6.0.0
  share_plus: 12.0.2

  # Location
  geolocator: 14.0.2
  permission_handler: 12.0.3
  flutter_compass: ^0.8.1

  # Map (online tiles + pins, with offline disk cache)
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  cached_network_image: ^3.4.1

  # Photo import + boundary overlays (SHP/KML/KMZ/GeoJSON)
  image_picker: ^1.2.2
  file_picker: ^11.0.2
  xml: ^6.6.1
  archive: ^4.0.9
  proj4dart: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#BFC8AE"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/sample/
    - assets/icon/
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
