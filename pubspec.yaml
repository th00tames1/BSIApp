name: bsi_field
description: "산불피해목 BSI 자동측정 현장 앱 (BSI field survey)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # On-device inference
  flutter_onnxruntime: ^1.8.0

  # Imaging
  image: ^4.0.0
  camera: 0.12.0+1

  # Storage / files
  sqflite: 2.4.2
  path: ^1.9.0
  path_provider: 2.1.5
  csv: 6.0.0
  share_plus: 12.0.2

  # Location
  geolocator: 14.0.2
  permission_handler: 12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
